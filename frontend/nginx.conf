# Zonas de límite (defensa en capas: Nginx absorbe ráfagas antes de llegar a Go).
limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Si hay un balanceador/CDN delante, descomente y use sus rangos para recuperar la IP real:
# set_real_ip_from 203.0.113.0/24;  real_ip_header X-Forwarded-For;  real_ip_recursive on;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size      16k;   # la ingesta no se expone públicamente (ver location /api/v1/admin/)
    client_body_timeout       10s;
    client_header_timeout     10s;
    send_timeout              15s;
    keepalive_timeout         30s;
    limit_conn                perip 30;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Cabeceras de seguridad (add_header se repite en cada location que define las suyas) ---
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se SOBRESCRIBE (no se añade) para impedir que el cliente falsifique su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 25s;
        proxy_hide_header Server;
    }
    # La ingesta (carga de .tsp) no se publica al exterior: se usa desde la red interna o un bastión.
    # Para habilitarla detrás de una VPN, reemplace "return 404" por un proxy_pass restringido por IP.
    location /api/v1/admin/ { return 404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
